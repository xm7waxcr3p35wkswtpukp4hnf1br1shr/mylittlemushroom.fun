<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>gothviolence.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #enter {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: black;
        }
    </style>
</head>
<body>
    <div id="enter"></div>

    <video id="vid" loop playsinline muted>
        <source src="Ф МИ Н 140.mp4" type="video/mp4">
    </video>

    <script>
        const enter = document.getElementById('enter');
        const vid = document.getElementById('vid');

        enter.addEventListener('click', function() {
            vid.muted = false;
            vid.play();
            enter.style.display = 'none';
        }, { once: true });
    </script>
</body>
</html>
